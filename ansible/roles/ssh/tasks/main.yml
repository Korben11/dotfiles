- name: Install ssh client
  become: true
  ansible.builtin.package:
    name: "{{ 'openssh' if ansible_facts['os_family'] == 'Archlinux' else 'openssh-client' }}"
    state: present

- name: Ensure ~/.ssh directory exists
  ansible.builtin.file:
    path: "{{ ansible_facts['env']['HOME'] }}/.ssh"
    state: directory
    mode: "0700"

- name: Set up ssh config
  template:
    src: vault.config.j2
    dest: "{{ ansible_facts['env']['HOME'] }}/.ssh/config"

- name: Copy ssh keys
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "{{ ansible_facts['env']['HOME'] }}/.ssh/{{ item | basename | regex_replace('^vault\\.', '') }}"
    mode: "0600"
  with_fileglob:
    - ssh/*
