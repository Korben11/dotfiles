---
- name: Install apps
  hosts: localhost
  tasks:
    - name: Terminal tools setup
      ansible.builtin.import_role:
        name: terminal
    - name: Neovim config setup
      ansible.builtin.import_role:
        name: nvim
    - name: Clipboard manager setup
      ansible.builtin.import_role:
        name: gpaste
    - name: Docker and utilities
      ansible.builtin.import_role:
        name: docker
    - name: K8s tooling setup
      ansible.builtin.import_role:
        name: k8s
    - name: Disk tools setup
      ansible.builtin.import_role:
        name: disk_tools

    - name: Verify dotfiles remote is reachable
      ansible.builtin.command:
        cmd: git ls-remote --exit-code origin HEAD
        chdir: "{{ playbook_dir | dirname }}"
      environment:
        GIT_SSH_COMMAND: ssh -o BatchMode=yes -o StrictHostKeyChecking=accept-new
      changed_when: false
      check_mode: false
